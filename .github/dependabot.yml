version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # minor + patch updates land as one PR per dependency type; majors stay separate PRs so each is reviewed alone
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: every recorded run re-judges on this exact core, and scripts/check-no-rom.mjs blocks the
      # ROM-bearing WASM of 3.4.0 by its sha256. A new version needs a new hash and a re-judge, not a bot PR.
      - dependency-name: c64-ready

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

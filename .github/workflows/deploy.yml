name: Deploy
# Production deploy of main to the Vercel project `ready` (https://ready.edycu.dev) after CI passes on that commit,
# then a smoke test of the live routes. The ROM-bearing emulator WASM is refused by content hash before anything ships.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy to production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ready.edycu.dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the Vercel CLI (pinned major)
        run: npm install --global vercel@53
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: The ROM-bearing emulator WASM never ships until the rights line is signed
        run: node scripts/check-no-rom.mjs .vercel/output
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke test the live routes
        run: |
          base=https://ready.edycu.dev
          fail=0
          check() {
            local path=$1 want=$2 got
            got=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$base$path")
            echo "$path -> $got (want $want)"
            echo "| \`$path\` | $got | $want |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" != "$want" ]; then fail=1; fi
          }
          { echo "### Live smoke test"; echo; echo "| route | status | expected |"; echo "|---|---:|---:|"; } >> "$GITHUB_STEP_SUMMARY"
          for p in / /scan /kiro /landing/ /deck/ /judge /runs/index.json /robots.txt; do check "$p" 200; done
          # /judge must be the judge guide itself, not the SPA shell
          judge_html=$(curl -s --retry 3 "$base/judge")  # read whole first: grep -q on a pipe SIGPIPEs curl under pipefail
          if grep -q '<h1 id="h1">Three minutes with a listing' <<<"$judge_html"; then echo "/judge carries the judge guide"; else echo "/judge is not the judge guide"; fail=1; fi
          check /c64.wasm 404
          exit "$fail"

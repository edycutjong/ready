name: CI
# Lint, typecheck, the full test suite (unit + property + real C64 core) and the production build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax-check every tracked JavaScript file
        run: git ls-files -z '*.js' '*.mjs' '*.cjs' | xargs -0 -n1 node --check
      - name: Parse every tracked JSON file
        run: |
          # shellcheck disable=SC2016  # the single-quoted block is JavaScript; its ${...} are template literals
          git ls-files -z '*.json' | xargs -0 node -e '
            const fs = require("node:fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              try { JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { bad++; console.error(`${f}: ${e.message}`); }
            }
            console.log(`${process.argv.length - 1} JSON files parsed, ${bad} invalid`);
            process.exit(bad ? 1 : 0);'
      - name: actionlint (pinned release, checksum verified)
        run: |
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # tests/unit/boot-detect.test.ts keeps one known limitation as `it.fails` (README, Honest limits 7):
      # vitest reports it as "1 expected fail" and fails the run if that test ever starts passing.
      - name: npm test
        run: npm test 2>&1 | tee vitest.log
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Tests (node ${{ matrix.node }})"
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' vitest.log | grep -E '^ *(Test Files|Tests|Duration) ' || echo "no summary line (the run did not finish)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The ROM-bearing emulator WASM is not in the build output
        run: node scripts/check-no-rom.mjs dist

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SYNTAX ERROR IN 20 — repairs the title path of a scanned 1984 BASIC listing on an emulated C64. A READY. screen set in a headstone, circled in blood-red proof ink, re-inks C64 blue and three title rows appear. Brand frame.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: crypt-soot plate, a headstone whose face is the C64 screen, READY. row and block cursor circled by a
          blood-red proof ring with a drip (the flagged line). Poster: brand complete.
  10-25%  trigger:      the corrected listing is RUN; a raster sweep runs down the screen and the cursor goes out          data-story="beat-2"
  25-55%  mechanism:    Blood-red mark on line 20 re-inks C64 blue; ?SYNTAX  ERROR IN 20 gives way to the title: it lives.        data-story="beat-3"
          (the blue ring draws over the red at 29-43%, the drip dries away, three title rows of pixel blocks appear)
  55-80%  resolution:   the blue ring and the title hold; the screen's light rims the headstone; one glow breath              data-story="beat-4"
  80-100% breathe + seam fade: story layer out 90-97%, red ring, drip and cursor back by 97%, so frames 5.9s and 0.1s match
-->
